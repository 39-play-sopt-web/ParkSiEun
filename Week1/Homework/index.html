<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sieun.log</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/nav.css" />
    <link rel="stylesheet" href="./css/photodump.css" />
    <link rel="stylesheet" href="./css/likes.css" />
    <link rel="stylesheet" href="./css/interests.css" />
    <link rel="stylesheet" href="./css/letter.css" />
    <link rel="stylesheet" href="./css/footer.css" />
  </head>
  <body>
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <img class="profile" src="./images/profile.jpg" alt="프로필 사진" />
      </div>
      <h1 class="header-center">sieun.log</h1>
      <div class="header-right">
        <a href="https://github.com/nueisx" target="_blank">
          <img
            class="social-icon"
            src="./images/github_icon.png"
            alt="GitHub 프로필로 이동"
          />
        </a>
      </div>
    </header>

    <!-- 네비게이션(사이드 목차) -->
    <nav class="side-nav">
      <ul>
        <li><a href="#photo-dump">📷 포토 덤프</a></li>
        <li><a href="#likes">❤️ 좋아하는 것</a></li>
        <li><a href="#interests">🙆‍♀️ 내 관심사</a></li>
        <li><a href="#to-webtory">🌰 To. 웹토리</a></li>
      </ul>
    </nav>

    <main>
      <!-- 포토 덤프 -->
      <section id="photo-dump">
        <h2>포토 덤프</h2>
        <div class="photo-grid">
          <div class="photo-item">
            <img src="./images/photo1.jpg" alt="나의사진1" />
          </div>
          <div class="photo-item">
            <img src="./images/photo2.jpg" alt="나의사진2" />
          </div>
          <div class="photo-item">
            <img src="./images/photo3.jpg" alt="쿠치파치" />
          </div>
          <div class="photo-item">
            <img src="./images/photo4.jpg" alt="치이카와" />
          </div>
          <div class="photo-item">
            <img src="./images/photo5.jpg" alt="케로로" />
          </div>
          <div class="photo-item">
            <img src="./images/photo6.jpg" alt="리락쿠마" />
          </div>
        </div>
      </section>

      <!-- 좋아하는 것 -->
      <section id="likes">
        <h2>좋아하는 것: 시나모롤 프렌즈 .. ૮꒰ྀི• ﻌ •ྀི꒱ა ♡</h2>
        <div class="banner" tabindex="0">
          <div class="banner-track">
            <img src="./images/like1.jpg" alt="시나모롤 프렌즈1" />
            <img src="./images/like2.jpg" alt="시나모롤 프렌즈2" />
            <img src="./images/like3.jpg" alt="시나모롤 프렌즈3" />
            <img src="./images/like4.jpg" alt="시나모롤 프렌즈4" />
            <img src="./images/like5.jpg" alt="시나모롤 프렌즈5" />
            <img src="./images/like6.jpg" alt="시나모롤 프렌즈6" />
            <img src="./images/like7.jpg" alt="시나모롤 프렌즈7" />
            <img src="./images/like8.jpg" alt="시나모롤 프렌즈8" />

            <img src="./images/like1.jpg" alt="" aria-hidden="true" />
            <img src="./images/like2.jpg" alt="" aria-hidden="true" />
            <img src="./images/like3.jpg" alt="" aria-hidden="true" />
            <img src="./images/like4.jpg" alt="" aria-hidden="true" />
            <img src="./images/like5.jpg" alt="" aria-hidden="true" />
            <img src="./images/like6.jpg" alt="" aria-hidden="true" />
            <img src="./images/like7.jpg" alt="" aria-hidden="true" />
            <img src="./images/like8.jpg" alt="" aria-hidden="true" />
          </div>
        </div>
      </section>

      <!-- 관심사 -->
      <section id="interests">
        <h2>내 관심사</h2>
        <div class="card-grid">
          <div class="card">
            <img src="./images/interest1.jpg" alt="이자카야" />
            <h3>맛집탐방🍽️</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest2.jpg" alt="오랑주리 전시" />
            <h3>전시🖼️</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest3.jpg" alt="어바웃타임" />
            <h3>영화🎥</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest4.jpg" alt="wave to earth" />
            <h3>음악🎵</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img
              src="./images/interest5.jpg"
              alt="롯데자이언츠 마스코트 누리"
            />
            <h3>롯데자이언츠⚾</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest6.jpg" alt="크리스마스 케이크" />
            <h3>크리스마스🎄</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest7.jpg" alt="나트랑 비치" />
            <h3>여행🌏</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>
        </div>
      </section>

      <!-- To. 웹토리 -->
      <section id="to-webtory">
        <h2>To. 웹토리</h2>
        <div class="letter">
          <p>잘 부탁드립니다</p>
        </div>
      </section>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
      <p>@_lumiereun</p>
    </footer>
  </body>
</html>
