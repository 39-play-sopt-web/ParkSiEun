<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sieun.log</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>

    <!-- 헤더 -->
    <header class="header">
        <div class="header-left">
            <img class="profile" src="./images/profile.jpg" alt="프로필 사진" />
        </div>
        <h1 class="header-center">sieun.log</h1>
        <div class="header-right">
            <a href="https://github.com/nueisx" target="_blank">
                <img class="social-icon" src="./images/github_icon.png" alt="GitHub" />
            </a>
        </div>
    </header>

    <!-- 네비게이션(사이드 목차) -->
    <nav class="side-nav">
      <ul>
        <li><a href="#photo-dump">📷 포토 덤프</a></li>
        <li><a href="#likes">❤️ 좋아하는 것</a></li>
        <li><a href="#interests">🙆‍♀️ 내 관심사</a></li>
        <li><a href="#to-webtory">🌰 To. 웹토리</a></li>
      </ul>
    </nav>

    <main>
      <!-- 포토 덤프 -->
      <section id="photo-dump">
        <h2>포토 덤프</h2>
        <div class="photo-grid">
          <div class="photo-item"><img src="./images/photo1.jpg" alt="사진1" /></div>
          <div class="photo-item"><img src="./images/photo2.jpg" alt="사진2" /></div>
          <div class="photo-item"><img src="./images/photo3.jpg" alt="사진3" /></div>
          <div class="photo-item"><img src="./images/photo4.jpg" alt="사진4" /></div>
          <div class="photo-item"><img src="./images/photo5.jpg" alt="사진5" /></div>
          <div class="photo-item"><img src="./images/photo6.jpg" alt="사진6" /></div>
        </div>
      </section>

      <!-- 좋아하는 것 -->
      <section id="likes">
        <h2>좋아하는 것: 시나모롤 프렌즈 .. ૮꒰ྀི• ﻌ •ྀི꒱ა ♡</h2>
        <div class="banner">
          <div class="banner-track">
            <img src="./images/like1.jpg" alt="좋아하는 것1" />
            <img src="./images/like2.jpg" alt="좋아하는 것2" />
            <img src="./images/like3.jpg" alt="좋아하는 것3" />
            <img src="./images/like4.jpg" alt="좋아하는 것4" />
            <img src="./images/like5.jpg" alt="좋아하는 것5" />
            <img src="./images/like6.jpg" alt="좋아하는 것6" />
            <img src="./images/like7.jpg" alt="좋아하는 것7" />
            <img src="./images/like8.jpg" alt="좋아하는 것8" />

            <img src="./images/like1.jpg" alt="" />
            <img src="./images/like2.jpg" alt="" />
            <img src="./images/like3.jpg" alt="" />
            <img src="./images/like4.jpg" alt="" />
            <img src="./images/like5.jpg" alt="" />
            <img src="./images/like6.jpg" alt="" />
            <img src="./images/like7.jpg" alt="" />
            <img src="./images/like8.jpg" alt="" />
          </div>
        </div>
      </section>

      <!-- 관심사 -->
      <section id="interests">
        <h2>내 관심사</h2>
        <div class="card-grid">

          <div class="card">
            <img src="./images/interest1.jpg" alt="관심사1" />
            <h3>맛집탐방🍽️</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest2.jpg" alt="관심사2" />
            <h3>전시🖼️</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest3.jpg" alt="관심사3" />
            <h3>영화🎥</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest4.jpg" alt="관심사4" />
            <h3>음악🎵</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest5.jpg" alt="관심사5" />
            <h3>롯데자이언츠⚾</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest6.jpg" alt="관심사6" />
            <h3>크리스마스🎄</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

          <div class="card">
            <img src="./images/interest7.jpg" alt="관심사7" />
            <h3>여행🌏</h3>
            <div class="card-buttons">
              <button class="like-btn">좋아요</button>
              <button class="dislike-btn">싫어요</button>
            </div>
          </div>

        </div>
      </section>

      <!-- To. 웹토리 -->
      <section id="to-webtory">
        <h2>To. 웹토리</h2>
        <div class="letter">
          <p>잘 부탁드립니다</p>
        </div>
      </section>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
      <p>@_lumiereun</p>
    </footer>
</body>
</html>
